<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Game Library</title><style>:root{--bg:#050608;--card:#111319;--line:#272b33;--muted:#969da9;--red:#e1192d;--green:#d5d8dc;--yellow:#ff5b68}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f6f7f9;font:15px system-ui,-apple-system,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}header{position:sticky;top:0;z-index:20;background:#050608e8;backdrop-filter:blur(18px);border-bottom:1px solid var(--line);padding:16px 4vw}.top{max-width:1500px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:15px}.brand{font-size:clamp(22px,4vw,35px);font-weight:950;letter-spacing:-1.5px}.brand b,.eyebrow,.En-cours{color:#ef233c}.sub,.meta{color:var(--muted);font-size:12px}main{max-width:1500px;margin:auto;padding:26px 4vw 80px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}.stat{background:linear-gradient(145deg,#17191f,#0e1014);border:1px solid var(--line);border-radius:18px;padding:16px}.stat strong{font-size:30px}.stat span{display:block;color:var(--muted);font-size:11px;font-weight:850}.hero{margin:24px 0;border:1px solid #3b2529;border-radius:26px;overflow:hidden;min-height:310px;display:grid;grid-template-columns:1.15fr 1fr;background:radial-gradient(circle at 70% 25%,#4a0d16,#10131a 55%,#090a0d)}.heroText{padding:36px;align-self:end}.hero h1{font-size:clamp(34px,5vw,64px);line-height:.94;margin:8px 0}.eyebrow{font-weight:900}.heroArt{background-size:cover;background-position:center;mask-image:linear-gradient(to right,transparent,#000 25%)}.controls{display:flex;gap:9px;flex-wrap:wrap;margin:22px 0}.controls input,.controls button,.top button{background:#14171c;color:#fff;border:1px solid #333740;border-radius:13px;padding:11px 14px}.controls input{flex:1;min-width:220px}.controls button,.top button{font-weight:800;cursor:pointer}.controls .active{background:#c91428;border-color:#ef233c}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:17px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;cursor:pointer;transition:.18s}.card:hover{transform:translateY(-5px);border-color:#b51a2c}.cover{aspect-ratio:2/3;background:linear-gradient(145deg,#242b39,#0d1015);background-size:cover;background-position:center;position:relative}.fallback{position:absolute;inset:0;display:grid;place-items:end start;padding:17px;font-size:23px;font-weight:950;line-height:.95;background:linear-gradient(transparent 35%,#050608e8)}.cardbody{padding:12px}.title{font-weight:850}.pill{display:inline-block;margin-top:9px;padding:5px 9px;border-radius:99px;background:#22262e;font-size:11px;font-weight:900}.Terminé{color:#d5d8dc}.À-acheter{color:#ff5b68}dialog{padding:0;border:1px solid #493036;border-radius:25px;background:#0e1015;color:#fff;width:min(920px,94vw);max-height:90vh;overflow:auto}dialog::backdrop{background:#000c;backdrop-filter:blur(10px)}.modalHero{min-height:260px;background:#151923 center/cover;position:relative}.modalHero:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#0e1015 3%,#0e1015bb 42%,transparent),linear-gradient(0deg,#0e1015,transparent 65%)}.modalTitle{position:absolute;z-index:2;left:28px;bottom:22px;max-width:70%}.modalTitle h2{font-size:clamp(28px,5vw,48px);line-height:.95;margin:7px 0}.close{position:absolute;z-index:5;right:16px;top:16px;border:0;background:#090a0dcc;color:#fff;border-radius:50%;width:42px;height:42px}.modalBody{padding:0 28px 30px}.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}.chip{background:#1b1e25;border:1px solid #3b3336;border-radius:99px;padding:7px 10px;color:#cbd0d8;font-size:12px;font-weight:750}.details{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.detail{background:#15181e;border:1px solid #292d35;border-radius:15px;padding:13px}.detail small{display:block;color:#858d99;margin-bot tton><div class=modalTitle><div class=eyebrow id=mplat></div><h2 id=mtitle></h2><div id=mcompat></div></div></div><div class=modalBody><div class=chips id=chips></div><div class=details id=details></div><div class=edit><div class=field><label>STATUT</label><select id=mstatus><option>En cours</option><option>À faire</option><option>Terminé</option><option>À acheter</option><option>À tester</option><option>Optionnel</option></select></div><div class=field><label>MA NOTE /10</label><input id=mrating type=number min=0 max=10 step=.5></div><div class=field><label>PROGRESSION %</label><input id=mprogress type=number min=0 max=100></div><div class=field><label>TEMPS DE JEU</label><input id=mhours placeholder="Ex. 12 h"></div><div class="field wide"><label>NOTES PERSONNELLES</label><textarea id=mnote></textarea></div></div><button class=save onclick=saveGame()>Enregistrer les modifications</button></div></dialog><script>const base=[{title:'X-Men Origins: Wolverine',platform:'PS3 • RPCS3',status:'En cours',compat:'Fonctionnel',year:'2009',genre:'Action / Hack & slash',developer:'Raven Software',saga:'Wolverine',note:'Partie en cours',cover:'https://cdn.awsli.com.br/2500x2500/138/138431/produto/7988662/jogo-x-men-origins-wolverine-ps3-574989c0.jpg'},{title:'Resident Evil HD Remaster',platform:'PC • GOG',status:'En cours',compat:'Fonctionnel',year:'2015',genre:'Survival horror',developer:'Capcom',saga:'Resident Evil',note:'Partie principale : Jill',cover:'https://wog.ch/nas/cover_xl/pcd/pcd_residentevil1hd.jpg'},{title:'Resident Evil Village',platform:'PC • PS5',status:'Terminé',compat:'Fonctionnel',year:'2021',genre:'Survival horror',developer:'Capcom',saga:'Resident Evil',note:'Terminé',cover:'https://static-ca.gamestop.ca/images/products/758593/3max.jpg'},{title:'Remember Me',platform:'PC • Steam',status:'À acheter',compat:'Fonctionnel',year:'2013',genre:'Action-aventure',developer:'Dontnod Entertainment',saga:'—',note:'À acheter',cover:''},{title:'Resident Evil 0 HD Remast etItem('mgl_live')||JSON.stringify(base)),filter='Tous',current=-1;document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-f]').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.f;render()});const esc=s=>(s??'').toString().replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function stats(){let n=s=>games.filter(g=>g.status===s).length;statsEl.innerHTML=[['JEUX',games.length],['EN COURS',n('En cours')],['TERMINÉS',n('Terminé')],['À ACHETER',n('À acheter')]].map(x=>`<div class=stat><strong>${x[1]}</strong><span>${x[0]}</span></div>`).join('')}function render(){stats();let q=document.getElementById('q').value.toLowerCase(),list=games.filter(g=>(filter==='Tous'||g.status===filter)&&g.title.toLowerCase().includes(q));grid.innerHTML=list.map(g=>{let i=games.indexOf(g),bg=g.cover?`background-image:url('${g.cover}')`:'';return `<article class=card onclick="openGame(${i})"><div class=cover style="${bg}"><div class=fallback>${g.cover?'':esc(g.title)}</div></div><div class=cardbody><div class=title>${esc(g.title)}</div><div class=meta>${esc(g.platform)} • ${g.year}</div><span class="pill ${g.status.replaceAll(' ','-')}">${g.status}</span></div></article>`}).join('')}function openGame(i){current=i;let g=games[i];mtitle.textContent=g.title;mplat.textContent=g.platform;mcompat.textContent='● '+g.compat;mhero.style.backgroundImage=g.cover?`url('${g.cover}')`:'linear-gradient(135deg,#4a0d16,#111319)';chips.innerHTML=[g.status,g.genre,g.saga].filter(x=>x&&x!=='—').map(x=>`<span class=chip>${esc(x)}</span>`).join('');details.innerHTML=`<div class=detail><small>ANNÉE</small><b>${g.year}</b></div><div class=detail><small>DÉVELOPPEUR</small><b>${esc(g.developer)}</b></div><div class=detail><small>COMPATIBILITÉ</small><b>${esc(g.compat)}</b></div><div class=detail><small>PLATEFORME</small><b>${esc(g.platform)}</b></div><div class=detail style="grid-column:1/-1"><small>PROGRESSION</small><b>${g.progress||0}%</b><div class=progress><div class=bar style="width:${g.progress||0}%"></div></div></div>`;mstatus.value=g.status;mrating.value=g.rating||'';mprogress.value=g.progress||0;mhours.value=g.hours||'';mnote.value=g.note||'';dlg.showModal()}function saveGame(){let g=games[current];g.status=mstatus.value;g.rating=mrating.value;g.progress=Math.max(0,Math.min(100,+mprogress.value||0));g.hours=mhours.value;g.note=mnote.value;localStorage.setItem('mgl_live',JSON.stringify(games));dlg.close();render()}function pick(){let p=games.filter(g=>['À faire','À tester'].includes(g.status)),g=p[Math.floor(Math.random()*p.length)];alert('🎲 Prochaine mission : '+g.title+'\n'+g.platform)}const statsEl=document.getElementById('stats');render()</script></body></html>
